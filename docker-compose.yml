services:
  postgres:
    image: postgres:16-alpine
    container_name: get_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-get_idiomas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-get_idiomas}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - get_network

  redis:
    image: redis:7-alpine
    container_name: get_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - get_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: get_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PROJECT_NAME: ${PROJECT_NAME:-Get Idiomas AI Writing System}
      VERSION: ${VERSION:-0.1.0}
      API_V1_STR: ${API_V1_STR:-/api/v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-get_idiomas}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-get_idiomas}
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - get_network

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: get_ai_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PROJECT_NAME: ${AI_PROJECT_NAME:-Get Idiomas AI Evaluation Service}
      VERSION: ${VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gpt-4o}
      ENFORCE_ZDR: ${ENFORCE_ZDR:-true}
      AI_DETECTION_THRESHOLD: ${AI_DETECTION_THRESHOLD:-0.70}
    volumes:
      - ./ai_service:/app
    networks:
      - get_network

volumes:
  postgres_data:
  redis_data:

networks:
  get_network:
    driver: bridge
